[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avito-recsys-coursework"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.4,<2",
    "matplotlib>=3.7,<4",
    "numpy>=1.24,<3",
    "pandas>=2.0,<4",
    "pyarrow>=14,<24",
    "scikit-learn>=1.3,<2",
    "scipy>=1.10,<2",
    "tabulate>=0.9,<1",
    "torch>=2.1,<3",
]

[project.optional-dependencies]
test = ["pytest>=7.4,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
